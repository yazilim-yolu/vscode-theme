; INI — tema testi.
; Noktalı virgül ve diez ile yorum, bölümler, çeşitli değer tipleri.

# Diez yorumu da desteklenir.

[genel]
ad = Yazılım Yolu
surum = 0.2.1
aciklama = "Tırnaklı değer — boşluk ve = içerebilir"
tekil = 'tek tırnaklı değer'
aktif = true
devre_disi = false
bos =
yol = C:\Users\Anka\Projects\yazilim_yolu\vscode-theme

[sayilar]
tamsayi = 42
negatif = -17
ondalik = 3.14159
ussel = 3.14e-2
onaltilik = 0xDEADBEEF
sekizlik = 0755
buyuk = 1000000

[renkler]
mor = #7C3BED
turkuaz = #3ABACD
lacivert = #232D5B
zemin = #141830
liste = mor,turkuaz,lacivert

[tema.dark]
editor.background = #141830
sideBar.background = #11142A
activityBar.background = #0D1022
statusBar.background = #0D1022
yorum_rengi = #5C6280

[tema.light]
editor.background = #FFFFFF
sideBar.background = #F5F6FA

[core]
repositoryformatversion = 0
filemode = false
bare = false
logallrefupdates = true

[remote "origin"]
url = https://github.com/zumrudu-anka/yazilim-yolu-theme.git
fetch = +refs/heads/*:refs/remotes/origin/*

[branch "main"]
remote = origin
merge = refs/heads/main

[alias]
lg = log --oneline --graph --decorate --all
st = status --short --branch

[ortam]
PATH = ${PATH}:/usr/local/bin
HOME = %USERPROFILE%
TEMA = %(ad)s-dark
