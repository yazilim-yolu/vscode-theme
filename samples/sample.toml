# TOML — tema testi.
# Tablo, tablo dizisi, satır içi tablo ve bütün skaler tipler.

baslik = "Yazılım Yolu Tema"
surum = "0.2.1"
aktif = true
devre_disi = false

# Sayılar
[sayilar]
tamsayi = 42
negatif = -17
artili = +99
ayirici = 1_000_000
onaltilik = 0xDEADBEEF
sekizlik = 0o755
ikilik = 0b1010_1010
ondalik = 3.14159
ussel = 3.14e-2
buyuk_ussel = 5e+22
sonsuz = inf
eksi_sonsuz = -inf
tanimsiz = nan

# Metinler
[metinler]
temel = "satır\nsonu\ttab \"tırnak\" \u00e7"
degismez = 'C:\Users\Anka\Projects — \n kaçmaz'
cok_satirli = """
Birinci satır.
İkinci satır — "tırnak" serbest.
Sondaki boşluk kaçışı: \
devam eder.
"""
cok_satirli_ham = '''
$degisken genişletilmez
\n kaçmaz
'''

# Tarih ve saat
[zaman]
offset_tarih_saat = 2026-09-11T08:30:00Z
offset_yerel = 2026-09-11T11:30:00+03:00
yerel_tarih_saat = 2026-09-11T08:30:00.999
yerel_tarih = 2026-09-11
yerel_saat = 08:30:00.123456

# Diziler
[diziler]
renkler = ["#7C3BED", "#3ABACD", "#232D5B"]
sayilar = [1, 2, 3, 4, 5]
karisik = [
  "metin",
  42,
  3.14,
  true,
  [1, 2],
]
matris = [[1, 2], [3, 4], [5, 6]]

# Satır içi tablo
[bilesen]
ad = "board"
konum = { x = 12, y = 34, z = 0 }
stil = { renk = "#7C3BED", kalinlik = 2, kesikli = false }

# İç içe tablolar
[paket]
name = "yazilim-yolu-theme"
edition = "2021"

[paket.bagimliliklar]
serde = { version = "1.0", features = ["derive"] }
tokio = "1.38"

[paket.bagimliliklar.gelistirme]
criterion = "0.5"

# Tablo dizisi
[[gorevler]]
id = 1
baslik = "tema testi"
tamamlandi = false
etiketler = ["mor", "turkuaz"]

  [gorevler.meta]
  olusturan = "yazilim-yolu"
  oncelik = 3

[[gorevler]]
